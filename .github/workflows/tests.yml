name: Validate photo studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: xvfb-run -a env PHOTO_STUDIO_GUI_TESTS=1 python -m pytest tests/test_gui_smoke.py -q
      - run: node --check docs/site.js
